
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: durgsetu-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      DEBUG: "False"
      SERVE_GUNICORN: "true"
      PORT: "8000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - durgsetu-network

  db:
    image: postgres:16-alpine
    container_name: durgsetu-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - durgsetu-network

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  durgsetu-network:
    driver: bridge
