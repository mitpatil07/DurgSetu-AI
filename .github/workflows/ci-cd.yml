name: DurgSetu AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================
  # 1. Backend CI (Python / Django checks & Docker Build)
  # =========================================================
  backend-ci:
    name: Backend CI & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libgomp1

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django Project System Check
        run: |
          python backend/manage.py check

      - name: Build Backend Docker Image
        run: |
          docker build -t durgsetu-backend:latest ./backend

  # =========================================================
  # 2. Frontend CI (React / Vite Build & Docker Build)
  # =========================================================
  frontend-ci:
    name: Frontend CI & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Build Vite Application
        run: |
          cd Frontend
          npm run build

      - name: Build Frontend Production Docker Image
        run: |
          docker build -f Frontend/Dockerfile.prod -t durgsetu-frontend:latest ./Frontend

  # =========================================================
  # 3. Docker Compose Integration Test
  # =========================================================
  integration-test:
    name: Docker Compose Integration Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Launch Stack with Docker Compose
        run: |
          docker compose -f docker-compose.prod.yml up --build -d

      - name: Verify Service Health
        run: |
          sleep 10
          docker compose -f docker-compose.prod.yml ps
          curl -f http://localhost:8000/api/ || (docker compose -f docker-compose.prod.yml logs && exit 1)

      - name: Shutdown Containers
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down

  # =========================================================
  # 4. CD / Deployment Stage
  # =========================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deployment (Optional Webhook)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Log Deployment Success
        run: |
          echo "CI/CD Pipeline finished successfully for commit ${{ github.sha }}!"
